[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmux-status-server"
version = "0.1.0"
description = "Claude usage server and Claude/Codex tmux status renderer"
requires-python = ">=3.10"
dependencies = [
    "bottle>=0.12.25",
]

[tool.setuptools.packages.find]
include = ["tmux_status_server*"]

[project.scripts]
tmux-status-server = "tmux_status_server.__main__:main"
tmux-status-renderd = "tmux_status_server.render:main"
