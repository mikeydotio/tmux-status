# tmux-status: 4-line status bar overlay
# https://github.com/mikeydotio/tmux-status
#
# This file is sourced from the user's tmux.conf. It ONLY sets status-bar
# options — keybindings, prefix, mouse, terminal, and other preferences
# are left to the user's own config.

# ── Dynamic settings (clock format, etc.) ──────────────────────
run-shell '~/.local/bin/tmux-status-apply-config'

# ── Status bar structure ───────────────────────────────────────
# Three lines: Claude model/ctx/quota (top), git/path, windows+clock (bottom)
set -g status 3
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=terminal,fg=colour7'

# Line 0 (top): Claude model, effort, context %, and quota bars — ONE combined
# line; empty when the pane isn't running Claude. One #() reader = one fork.
set -g status-format[0] '#[align=left]#(~/.local/bin/tmux-claude-status "#{pane_pid}")'

# Line 1: filesystem path and git info for the active pane
# (the render daemon resolves pane_pid -> path; the reader is fork-free)
set -g status-format[1] '#[align=left,fg=colour7] #(~/.local/bin/tmux-git-status "#{pane_pid}")'

# Line 2 (bottom): standard tmux status bar layout (status-left, windows, status-right)
# This is the default status-format[0] relocated to the bottom line so the standard
# status-left / window-list / status-right rendering appears there.
set -g status-format[2] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# ── Status-left: (empty — the hostname now lives in the top banner) ──
set -g status-left ' '
set -g status-left-length 10

# ── Status-right: clock (format applied by tmux-status-apply-config) ──
# Fallback in case apply-config hasn't run yet
set -g status-right '#{?client_prefix,#[fg=colour11][cmd] ,}#[fg=colour4]「#[fg=colour7]%-l:%M#[fg=colour4]」'
set -g status-right-length 20

# ── Window tab styling ─────────────────────────────────────────
# Square brackets around every tab, colored to match the window name they
# wrap; active tab is bold + bright. Activity flag turns an inactive tab
# (brackets and name) yellow for unseen output.
set -g window-status-style 'bg=terminal'
set -g window-status-activity-style 'none'
set -g window-status-current-style 'bg=terminal'
set -g window-status-format '#[bg=terminal]#{?window_activity_flag,#[fg=colour3],#[fg=colour7]}[#{window_name}]'
set -g window-status-current-format '#[bg=terminal,fg=colour15,bold][#{window_name}]'
set -g window-status-separator ' '

# ── Render-daemon wake hooks (cold-start gap fix) ──────────────
# The render daemon refreshes the per-pane cache on a ~5s cadence, so a brand-new
# pane or session would otherwise show blank Claude lines until the next tick.
# Poke the daemon (SIGUSR1 -> immediate tick) on infrequent structural events so
# the status fills in sub-second. `run-shell -b` backgrounds it so the hook never
# blocks tmux, and these events are NOT the per-render path — the single fork the
# poke costs cannot pile up. (pane-focus-in is deliberately omitted: it fires on
# every pane move; the /clear case is covered by the Claude statusLine hook.)
# The `>/dev/null 2>&1` on every -b hook is a pane-safety invariant: tmux renders
# any run-shell stdout into the active pane's view-mode (blanking it), so a
# background hook must never emit output. poke is already silent; the redirect
# keeps the whole -b hook surface immune if that ever changes.
set-hook -g after-new-window       'run-shell -b "~/.local/bin/tmux-status-poke >/dev/null 2>&1"'
set-hook -g after-split-window     'run-shell -b "~/.local/bin/tmux-status-poke >/dev/null 2>&1"'
set-hook -g session-created        'run-shell -b "~/.local/bin/tmux-status-poke >/dev/null 2>&1"'
set-hook -g client-session-changed 'run-shell -b "~/.local/bin/tmux-status-poke >/dev/null 2>&1"'

# ── Client-accumulation guardrail (fork-storm prevention) ──────
# tmux re-forks the status #() readers for EVERY attached client each
# status-interval, so N abandoned mosh/SSH clients = an N× fork storm (this has
# driven a 10-core Mac's load average to ~100). A new attach is exactly the
# accumulation trigger — an iOS mosh client (Moshtail) reconnecting spawns a
# fresh client without the old one detaching — so prune-on-attach self-limits the
# pile-up: detach clients idle > 2h AND reap their backing mosh-server/sshd-session
# so nothing lingers (mosh has no idle timeout) or silently re-attaches. Only idle
# clients are touched, so the just-attached client and the active session are
# safe. `run-shell -b` backgrounds it; a launchd/systemd timer backstops this for
# the case where no new client ever attaches (see io.mikey.tmux-status-prune).
#
# `>/dev/null 2>&1` is MANDATORY, not cosmetic: tmux renders ANY `run-shell`
# stdout — even backgrounded with -b — into the ACTIVE pane's view-mode, which
# blanks the pane's visible contents and displays the text until dismissed. The
# prune script prints a one-line summary, so without this redirect every client
# attach (each mosh/Moshtail reconnect) hijacks the focused pane. Background
# hooks must stay silent to tmux — see the pane-safety gate in
# tests/unit/test_status_conf_contract.sh.
set-hook -g client-attached 'run-shell -b "~/.local/bin/tmux-status-prune-clients --reap-transport 7200 >/dev/null 2>&1"'

# ── Activity monitoring ────────────────────────────────────────
setw -g monitor-activity on
set -g visual-activity off

# ── Automatic window naming ────────────────────────────────────
# Shows ✧ prefix when a Claude Code session is detected in the pane
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{m:*claude*,#{pane_current_command}},✧ #{b:pane_current_path},#{pane_current_command}}'
